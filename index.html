<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>우리 가족 할 일</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족보드">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
@font-face{font-family:Galmuri11;src:url(fonts/Galmuri11.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Galmuri11;src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --k:#000; --w:#FCFCFC; --g:#7C7C7C; --g2:#BCBCBC; --dk:#1A1A1A;
  --red:#F83800; --yel:#F8B800; --grn:#00A800; --blu:#0058F8; --sky:#5C94FC; --pur:#6844FC;
  --hi:#FC7460; --lo:#3CBCFC;
  --px:4px;
  --panel:#000; --fg:#FCFCFC; --line:#FCFCFC; --ink:#000; --btn:#FCFCFC; --ring:#000; --ring2:#FCFCFC;
  --card:#1A1A1A; --cardline:#7C7C7C; --muted:#BCBCBC; --faint:#7C7C7C; --hl:#F8B800;
  --chipbg:#333; --todaybg:#3A2A00; --selbg:#2A2A55; --veil:rgba(0,0,0,.88); --clockshadow:#A44000;
}
body.light{
  --panel:#FCF4DC; --fg:#000; --line:#000; --btn:#FCFCFC; --ring:#FCFCFC; --ring2:transparent;
  --card:#FFFFFF; --cardline:#8C8C8C; --muted:#585858; --faint:#8C8C8C; --hl:#D82800; --lo:#0058F8;
  --chipbg:#F0E2BC; --todaybg:#FCE4A0; --selbg:#C8D8FC; --veil:rgba(0,0,0,.55); --clockshadow:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0!important}
html,body{margin:0;height:100%;color:var(--fg);font-family:Galmuri11,"Noto Sans KR",monospace;overscroll-behavior:none;-webkit-font-smoothing:none;font-smooth:never}
body{user-select:none;-webkit-user-select:none;background:#000 radial-gradient(#FCFCFC 1px,transparent 1.5px) 0 0/46px 46px}
body.am{--accent:var(--yel)} body.pm{--accent:var(--pur)}
body.light.am{background:var(--sky) linear-gradient(transparent calc(100% - 28px),#C84C0C calc(100% - 28px)) fixed}
body.light.am::before{content:"";position:fixed;left:0;right:0;bottom:24px;height:4px;background:#FCBCB0;pointer-events:none}
body.light.pm{background:#24188C radial-gradient(#FCFCFC 1px,transparent 1.5px) 0 0/46px 46px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.07) 0 2px,transparent 2px 4px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#root{height:100%}
.app{height:100%;display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px 16px 36px}
.msg{height:100%;display:grid;place-items:center;font-size:22px;text-align:center;padding:30px;line-height:1.6}

/* NES dialog box */
.box,.wxc,.sched,.col,.ptab,.modal,.drawer,.slots,.clockbox{background:var(--panel);border:var(--px) solid var(--line);box-shadow:0 0 0 var(--px) var(--ring),8px 8px 0 4px rgba(0,0,0,.45)}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.clockbox{padding:12px 14px}
.date{font-size:30px;font-weight:700;line-height:1.2;color:var(--hl);text-shadow:3px 3px 0 var(--clockshadow);text-align:center}
.date small{display:block;font-size:22px;color:var(--fg);text-shadow:none;margin-top:2px}
.clock{display:block;width:140px;height:140px;margin:10px auto 0}
.clock .face{fill:var(--card);stroke:var(--line);stroke-width:4}
.clock text{fill:var(--fg);font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.clock .hh{stroke:var(--fg);stroke-width:6}
.clock .mh{stroke:var(--hl);stroke-width:4}
.clock .dot{fill:var(--red)}
.wx{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wxc{padding:10px;display:flex;flex-direction:column;gap:3px;min-height:168px}
.wxc .lb{font-weight:700;font-size:13px;display:flex;justify-content:space-between;color:var(--hl)}
.wxc .lb span:first-child::before{content:"▶";margin-right:3px}
.wxc .ic{font-size:38px;line-height:1.2;margin-top:2px}
.wxc .tp{font-size:22px;font-weight:700}
.wxc .tp .lo{color:var(--lo)}
.wxc .tp .hi{color:var(--hi)}
.wxc .sk{font-size:14px}
.wxc .pp{font-size:12px;color:var(--muted)}
.wxc.na{color:var(--muted);font-size:13px;justify-content:center;text-align:center}
body.light.am .sync{color:#000}
body.light.pm .sync{color:#FCFCFC}
.sched{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sh{display:flex;align-items:center;padding:10px 10px 10px 12px;border-bottom:var(--px) solid var(--line)}
.sh h2{margin:0;font-weight:700;font-size:20px;flex:1}
.plus,.tool,.btn,.chipb,.evdel,.addBtn{background:var(--btn);color:var(--ink);font-weight:700;border:3px solid var(--ink);box-shadow:inset -4px -4px 0 var(--g2),0 0 0 2px var(--ring2)}
.plus:active,.tool:active,.btn:active,.chipb:active,.addBtn:active{box-shadow:inset 4px 4px 0 var(--g2),0 0 0 2px var(--ring2)}
.plus{padding:8px 10px;font-size:14px}
.evs{flex:1;overflow-y:auto;padding:4px 10px 14px;-webkit-overflow-scrolling:touch}
.dayh{font-weight:700;font-size:14px;color:var(--muted);margin:14px 2px 8px;display:flex;gap:8px;align-items:center}
.dayh.today{color:var(--fg)}
.dayh .tag{background:var(--accent);color:var(--ink);padding:2px 6px;font-size:12px}
body.pm .dayh .tag{color:#FCFCFC}
.ev{display:flex;align-items:center;gap:10px;padding:9px 8px;background:var(--card);border:2px solid var(--cardline);margin-bottom:8px;width:100%;text-align:left;min-height:50px}
.ev .tm{font-weight:700;font-size:14px;min-width:46px;color:var(--hl)}
.ev .tm.all{color:var(--muted);font-size:12px}
.ev .et{flex:1;font-size:15px;line-height:1.4;word-break:keep-all}
.ev .ws{display:flex;font-size:17px;gap:1px}
.ev.sel{border-color:var(--red)}
.evdel{background:var(--red);color:#FCFCFC;box-shadow:inset -4px -4px 0 #A41000;padding:6px 10px;font-size:13px}
.noev{color:var(--faint);font-size:13px;padding:4px 4px 2px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;gap:16px;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;min-height:66px}
.slots{display:flex;padding:6px;margin:0;gap:8px;flex:none}
.slot{font-size:22px;font-weight:700;padding:10px 18px;color:var(--faint)}
.slot::before{content:"▶ ";visibility:hidden}
.slot.on::before{visibility:visible;animation:blink 1s steps(1) infinite}
.slot.on.am{background:var(--yel);color:var(--ink)}
.slot.on.pm{background:var(--pur);color:#FCFCFC}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.tool{padding:10px 12px;font-size:14px;white-space:nowrap;text-decoration:none}
.tool.on{background:var(--yel)}
.sync{font-size:12px;max-width:60px;line-height:1.3;color:#BCBCBC;font-weight:700}
.board{flex:1;min-height:0;display:grid;gap:18px}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.head{padding:12px 12px 8px;display:flex;align-items:center;gap:12px}
.ava{width:60px;height:60px;display:grid;place-items:center;font-size:36px;flex:none;border:3px solid var(--line)}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar{flex:1;height:16px;background:var(--card);border:2px solid var(--line);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 10px,var(--panel) 10px 12px)}
.bar i{display:block;height:100%;transition:width .4s steps(6)}
.cnt{font-weight:700;font-size:15px;min-width:40px;text-align:right}
.week{display:flex;gap:4px;padding:2px 12px 10px;border-bottom:var(--px) solid var(--line)}
.week span{flex:1;text-align:center;font-size:11px;color:var(--faint)}
.week b{display:block;margin:0 auto 3px;width:22px;height:22px;background:var(--card);border:2px solid var(--cardline);font-size:13px;line-height:18px;color:var(--ink)}
.week b.full{background:var(--yel);border-color:var(--line)}
.week b.part{background:#8C5C00;border-color:var(--yel)}
.week span.today{color:var(--fg);font-weight:700}
.cards{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:3px solid var(--cardline);text-align:left;width:100%;min-height:78px;position:relative;cursor:pointer}
.card:active{transform:translate(2px,2px)}
.card .ic{font-size:32px;width:42px;text-align:center;flex:none}
.card .tx{flex:1;font-size:21px;line-height:1.35;word-break:keep-all}
.card .ck{width:44px;height:44px;border:var(--px) solid var(--line);flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--ink);background:var(--panel)}
.card.done{background:var(--c-soft);border-color:var(--c);color:var(--ink)}
.card.done .tx{color:#555;text-decoration:line-through;text-decoration-thickness:3px}
.card.done .ck{background:var(--yel);border-color:var(--ink);animation:coin .4s steps(4)}
@keyframes coin{0%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-14px) scaleX(.3)}50%{transform:translateY(-20px) scaleX(1)}75%{transform:translateY(-10px) scaleX(.3)}100%{transform:none}}
@keyframes blink{50%{opacity:0}}
.card .del{position:absolute;top:-8px;right:-8px;min-width:32px;height:32px;padding:0 8px;background:var(--red);color:#FCFCFC;font-size:14px;font-weight:700;display:grid;place-items:center;border:3px solid #FCFCFC}
.card .mv{display:flex;flex-direction:column;gap:4px;margin-right:24px}
.card .mv button{width:30px;height:24px;background:var(--btn);color:var(--ink);font-size:11px;border:2px solid var(--ink)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;line-height:1.7}
.allDone{padding:12px;text-align:center;font-size:20px;font-weight:700;background:var(--panel);color:var(--hl);border:var(--px) double var(--hl);animation:blink 1.2s steps(1) 3}
.add{border:3px dashed var(--muted);padding:12px;display:flex;flex-direction:column;gap:10px}
.inp{width:100%;padding:12px;border:3px solid var(--line);font-size:17px;outline:none;user-select:text;-webkit-user-select:text;background:var(--panel);color:var(--fg)}
.inp:focus{border-color:var(--yel)}
.inp::-webkit-calendar-picker-indicator{filter:invert(1)}
.emos{display:flex;flex-wrap:wrap;gap:4px}
.emos button{width:38px;height:38px;font-size:22px;border:2px solid transparent}
.emos button.on{border-color:var(--yel);background:var(--chipbg)}
.row{display:flex;gap:12px}
.btn{flex:1;padding:12px;font-size:16px}
.btn.pri{background:var(--yel);box-shadow:inset -4px -4px 0 #A46000,0 0 0 2px var(--ring2)}
.addBtn{padding:14px;font-size:16px;width:100%}
.nameIn{font-size:20px;width:100%;padding:6px 8px;border:3px solid var(--yel);background:var(--panel);color:var(--fg);font-weight:700;user-select:text;-webkit-user-select:text}
.picker{position:absolute;left:10px;right:10px;top:86px;z-index:5;background:var(--panel);border:var(--px) solid var(--yel);padding:12px}
.picker .emos button{width:44px;height:44px;font-size:26px}
.colors{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border:3px solid var(--ink)}
.colors button.on{outline:3px solid var(--line)}

/* parents tab + drawer */
.ptab{display:flex;flex-direction:column;align-items:center;padding:12px 4px;gap:14px;cursor:pointer}
.ptab .pm1{display:flex;flex-direction:column;align-items:center;gap:4px}
.ptab .pa{width:54px;height:54px;display:grid;place-items:center;font-size:30px;position:relative;border:3px solid var(--line)}
.ptab .pn{font-weight:700;font-size:15px}
.ptab .pc{font-size:12px;color:var(--muted)}
.ptab .pa.ok::after{content:"★";position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;background:var(--yel);color:var(--ink);font-size:13px;display:grid;place-items:center;border:2px solid var(--line)}
.ptab .open{margin-top:auto;writing-mode:vertical-rl;font-weight:700;font-size:15px;letter-spacing:3px;background:var(--yel);color:var(--ink);padding:12px 8px;border:3px solid var(--line)}
.shade{position:absolute;inset:-8px;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(78%,720px);z-index:21;padding:12px;display:flex;flex-direction:column;gap:14px;animation:slide .3s steps(5)}
.drawer .dh{display:flex;align-items:center;padding:2px 4px}
.drawer .dh h3{margin:0;flex:1;font-weight:700;font-size:22px;color:var(--hl)}
.drawer .board{grid-template-columns:1fr 1fr}
.drawer .col{box-shadow:none}
@keyframes slide{from{transform:translateX(60px);opacity:.2}to{transform:none;opacity:1}}

/* modal */
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:center;padding:20px}
.modal{padding:20px;width:min(580px,100%);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.modal h3{margin:0;font-weight:700;font-size:24px;color:var(--hl)}
.fl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.fl::before{content:"▶ "}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chipb{padding:9px 12px;font-size:15px}
.chipb.on{background:var(--yel);box-shadow:inset -4px -4px 0 #A46000,0 0 0 2px var(--ring2)}
.chips input{width:auto;padding:8px 10px;font-size:15px}


/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 10px 8px;border-bottom:var(--px) solid var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 5px;background:var(--card);border:2px solid var(--cardline);cursor:pointer}
.wd .wn{font-size:11px;color:var(--muted)}
.wd .wdn{font-size:17px;font-weight:700}
.wd .dots{height:8px;display:flex;gap:2px}
.wd .dots i{width:6px;height:6px;background:var(--yel)}
.wd.sat .wn{color:var(--lo)} .wd.sun .wn,.wd.hol .wn,.wd.hol .wdn{color:var(--hi)}
.wd.today{border-color:var(--yel);background:var(--todaybg)}
.wd.past{opacity:.55}
.sh h2{cursor:pointer}
/* calendar view */
.calBg{position:fixed;inset:0;z-index:30;background:var(--veil);padding:16px 16px 36px;display:flex}
.calv{flex:1;display:grid;grid-template-columns:1fr 330px;gap:16px;min-height:0}
.calm,.cald{background:var(--panel);border:var(--px) solid var(--line);box-shadow:0 0 0 var(--px) var(--ring);display:flex;flex-direction:column;min-height:0}
.calh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:var(--px) solid var(--line)}
.calh h3{margin:0;flex:1;text-align:center;font-size:26px;font-weight:700;color:var(--hl)}
.calh .tool{padding:9px 12px;font-size:14px}
.cdow{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 0;gap:6px}
.cdow span{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.cdow span:nth-child(6){color:var(--lo)} .cdow span:nth-child(7){color:var(--hi)}
.cgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;padding:8px;min-height:0}
.cc{background:var(--card);border:2px solid var(--cardline);padding:5px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;min-height:0;text-align:left}
.cc .cn{font-size:15px;font-weight:700}
.cc.sat .cn{color:var(--lo)} .cc.sun .cn,.cc.hol .cn{color:var(--hi)}
.cc .ch{font-size:11px;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.out{opacity:.35}
.cc.today{border-color:var(--yel)}
.cc.today .cn{background:var(--yel);color:var(--ink);align-self:flex-start;padding:0 4px}
.cc.sel{border:var(--px) solid var(--line);background:var(--selbg)}
.cc .ce{font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--chipbg);padding:1px 3px;border-left:3px solid var(--yel)}
.cc .cm{font-size:11px;color:var(--muted)}
.cald .evs{padding-top:8px}
.cald .addDay{flex:none;margin:10px;padding:16px;font-size:17px}
@media (orientation:portrait), (max-width:960px){
  .calv{grid-template-columns:1fr;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr)}
}

/* 가로 패드처럼 세로가 짧은 화면: 시계·날씨를 줄여 일정 칸을 넓힘 */
@media (orientation:landscape) and (max-height:900px){
  .clockbox{padding:8px 12px}
  .clock{width:110px;height:110px;margin-top:6px}
  .date{font-size:26px}
  .wxc{min-height:0;padding:8px}
  .wxc .ic{font-size:28px}
  .wxc .tp{font-size:19px}
  .side{gap:12px}
}
/* side tabs + memos */
.sh.tabs{gap:4px;padding:10px 8px 0;align-items:flex-end}
.stab{flex:1;padding:9px 6px;font-size:16px;font-weight:700;color:var(--faint);background:var(--card);border:var(--px) solid var(--cardline);border-bottom:0;position:relative}
.stab.on{color:var(--fg);background:var(--panel);border-color:var(--line);padding-bottom:calc(9px + var(--px));margin-bottom:calc(-1 * var(--px));z-index:1}
.sh.tabs .plus{align-self:center;margin:0 0 6px 4px}
.stab.on::before{content:"▶";color:var(--hl);margin-right:3px}
.badge{position:absolute;top:-8px;right:-6px;background:var(--red);color:#FCFCFC;font-size:12px;min-width:22px;height:22px;line-height:18px;border:2px solid var(--line);text-align:center;animation:blink 1s steps(1) infinite}
.memos{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.memo{background:var(--card);border:3px solid var(--cardline);padding:9px 10px 8px;position:relative;cursor:pointer}
.memo.new{border-color:var(--hl)}
.memo.sel{border-color:var(--red)}
.memo .mh{display:flex;align-items:center;gap:7px;font-size:13px}
.memo .mav{width:30px;height:30px;display:grid;place-items:center;font-size:18px;border:2px solid var(--line);flex:none}
.memo .mn{font-weight:700;font-size:15px}
.memo .mto{color:var(--muted)}
.memo .mt{margin-left:auto;color:var(--faint);font-size:12px}
.memo .mx{font-size:16px;line-height:1.5;margin:7px 2px 6px;word-break:keep-all;white-space:pre-wrap}
.memo .mf{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.like{font-size:14px;font-weight:700;padding:4px 10px;border:2px solid var(--cardline);color:var(--muted)}
.like.on{color:var(--red);border-color:var(--red)}
.memo .newtag{background:var(--hl);color:var(--ink);font-size:11px;padding:1px 5px;font-weight:700}
body.light .memo .newtag{color:#FCFCFC}
textarea.inp{resize:none;height:110px;line-height:1.5}
/* fx */
.burst{position:fixed;pointer-events:none;font-size:26px;font-weight:700;z-index:50;animation:fly 1.2s steps(10) forwards;text-shadow:3px 3px 0 #000}
@keyframes fly{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--panel);border:var(--px) solid var(--line);box-shadow:0 0 0 4px var(--ring);color:var(--fg);padding:14px 20px;font-weight:700;z-index:60;font-size:15px}
.toast::before{content:"▶ ";color:var(--hl)}

@media (orientation:portrait), (max-width:960px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100%}
  .side{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:stretch}
  .clockbox{align-self:stretch;display:flex;flex-direction:column;justify-content:center}
  .sched{grid-column:1/-1;min-height:380px}
  .main{min-height:640px}
  .drawer{width:94%}
}
</style>

<body class="am">

function mapErr(e){return {code:(e&&e.code==="permission-denied")?"invalid_argument":"unavailable",message:e&&e.message}}
function wrapDoc(s){return {id:s.id,exists:s.exists(),data:function(){return s.data()}}}
function mkDb(fs){
  function dref(path){
    var r=doc(fs,path);
    return {id:r.id,path:path,
      set:function(d){return setDoc(r,d).catch(function(e){throw mapErr(e)})},
      update:function(d){return updateDoc(r,d).catch(function(e){throw mapErr(e)})},
      delete:function(){return deleteDoc(r).catch(function(e){throw mapErr(e)})},
      onSnapshot:function(n,er){return onSnapshot(r,function(s){n(wrapDoc(s))},function(e){if(er)er(mapErr(e))})}};
  }
  function cref(path,cons){
    var c=collection(fs,path);
    return {path:path,
      doc:function(id){return dref(path+"/"+id)},
      where:function(f,op,v){return cref(path,(cons||[]).concat([where(f,op,v)]))},
      onSnapshot:function(n,er){var q=cons&&cons.length?query(c,...cons):c;return onSnapshot(q,function(s){n({docs:s.docs.map(wrapDoc),size:s.size,empty:s.empty})},function(e){if(er)er(mapErr(e))})}};
  }
  return {doc:dref,collection:function(p){return cref(p)}};
}

function renderWeek(m,tk){
  var mine=tasks().filter(function(t){return t.m===m.id});

  for(var i=6;i>=0;i--){
    var k=addDays(tk,-i);

    var cls=mine.length&&c===mine.length?"full":(c>0?"part":"");
    h+='<span class="'+(k===tk?"today":"")+'"><b class="'+cls+'">'+(cls==="full"?"⭐":"")+'</b>'+DAYS[dowOf(k)]+'</span>';
  }
  return h+'</div>';
}

/* ---------- writes ---------- */
var chkBusy={};
function flushChecks(k){
  if(!db||chkBusy[k]||!pend[k])return;
  var batch=pend[k];var keys=Object.keys(batch);if(!keys.length){delete pend[k];return}
  chkBusy[k]=true;syncMsg="저장 중…";renderSync();
  var ref=db.doc("checks/"+k);
  var exists=!!checks[k];
  var body=Object.assign({},batch);
  var p=exists?ref.update(body):ref.set(Object.assign({d:k},checks[k]||{},body));
  p.then(function(){
    checks[k]=Object.assign({},checks[k]||{},body);
    keys.forEach(function(id){if(pend[k]&&pend[k][id]===batch[id])delete pend[k][id]});
    if(pend[k]&&!Object.keys(pend[k]).length)delete pend[k];
    syncMsg="저장됨 ✓";renderSync();
  },function(err){
    if(err&&err.code==="invalid_argument"&&exists){checks[k]=null;delete checks[k]}   // doc vanished: retry with set
    else writeFail(err);
  }).then(function(){chkBusy[k]=false;if(pend[k])setTimeout(function(){flushChecks(k)},300)});
}
var cfgBusy=false,cfgDirty=false;
function saveCfg(){
  if(!db)return;cfgDirty=true;if(cfgBusy)return;
  cfgBusy=true;cfgDirty=false;syncMsg="저장 중…";renderSync();
  db.doc("config/main").set({members:cfg.members,tasks:cfg.tasks}).then(function(){syncMsg="저장됨 ✓";renderSync()},writeFail).then(function(){cfgBusy=false;if(cfgDirty)saveCfg()});
}
function writeFail(err){
  var c=err&&err.code;
  if(c==="invalid_argument"||c==="not_granted"||c==="revoked"){syncMsg="보기 전용";toast("이 계정은 보기만 할 수 있어요")}
  else{syncMsg="저장 실패";toast("저장하지 못했어요. 잠시 후 다시 눌러 주세요")}
  renderSync();
}

function burst(x,y,big){
  var set=big?["★","1UP","♥","★","+1","♪"]:["★","+1"],n=big?18:4,PAL=["#F8B800","#FC7460","#3CBCFC","#00A800","#F878F8","#FCFCFC"];
  for(var i=0;i<n;i++){
    var s=document.createElement("span");s.className="burst";s.textContent=set[i%set.length];s.style.color=PAL[i%PAL.length];
    s.style.left=x+"px";s.style.top=y+"px";
    var a=Math.random()*Math.PI*2,r=(big?140:60)+Math.random()*(big?160:40);
    s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");s.style.setProperty("--r",(Math.random()*360-180)+"deg");
    document.body.appendChild(s);setTimeout(function(el){return function(){el.remove()}}(s),1400);
  }
}

    var n={};s.docs.forEach(function(d){var x=d.data();if(x&&x.d)n[x.d]=Object.assign({},x)});checks=n;render();
  },function(){});

    events=s.docs.map(function(d){var x=d.data()||{};return {id:d.id,d:String(x.d||""),time:String(x.time||""),t:String(x.t||""),who:Array.isArray(x.who)?x.who:[]}});render();
  },function(){});

function start(){
  var slowT=setTimeout(function(){if(!cfg){conn="slow";render()}},10000);
  db.doc("config/main").onSnapshot(function(s){
    clearTimeout(slowT);
    if(!s.exists){conn="ok";cfg=JSON.parse(JSON.stringify(DEFAULT_CFG));render();db.doc("config/main").set(DEFAULT_CFG).catch(writeFail);return}
    var x=s.data()||{};
    // one-time: 아이 저녁 할 일 교체 (옛 id 남아 있으면 기본값으로 바꿔 저장)
    var OLD_PM=["t14","t15","t16","t17","t21","t22","t23"];
    if((x.tasks||[]).some(function(t){return OLD_PM.indexOf(t.id)>=0})){
      x.tasks=x.tasks.filter(function(t){return !((t.m==="kid1"||t.m==="kid2")&&t.s==="pm")})
        .concat(DEFAULT_CFG.tasks.filter(function(t){return (t.m==="kid1"||t.m==="kid2")&&t.s==="pm"}));
      db.doc("config/main").update({tasks:x.tasks}).catch(writeFail);
    }
    // don't clobber an inline edit in progress
    cfg={members:JSON.parse(JSON.stringify(x.members||[])),tasks:JSON.parse(JSON.stringify(x.tasks||[]))};
    conn="ok";render();
  },function(e){clearTimeout(slowT);conn=(e&&e.code==="invalid_argument")?"denied":"slow";render()});
  db.collection("memos").onSnapshot(function(s){
    memos=s.docs.map(function(d){var x=d.data()||{};return {id:d.id,from:String(x.from||""),to:Array.isArray(x.to)?x.to:[],text:String(x.text||""),at:+x.at||0,likes:+x.likes||0}});

    render();
  },function(){});
  subscribeDaily();
}


/* ---------- weather (Open-Meteo, 키 필요 없음) ---------- */
var WMO=[[[0],"☀️","맑음"],[[1],"🌤️","대체로 맑음"],[[2],"⛅","구름 조금"],[[3],"☁️","흐림"],[[45,48],"🌫️","안개"],
  [[51,53,55,56,57],"🌦️","이슬비"],[[61,63,65,66,67,80,81,82],"🌧️","비"],[[71,73,75,77,85,86],"🌨️","눈"],[[95,96,99],"⛈️","뇌우"]];
function wmo(c){for(var i=0;i<WMO.length;i++)if(WMO[i][0].indexOf(c)>=0)return WMO[i];return [[],"🌤️","-"]}
function grade(pm10,pm25){
  var g10=pm10==null?-1:pm10<=30?0:pm10<=80?1:pm10<=150?2:3;
  var g25=pm25==null?-1:pm25<=15?0:pm25<=35?1:pm25<=75?2:3;
  var g=Math.max(g10,g25);return g<0?"":["좋음","보통","나쁨","매우나쁨"][g];
}
function loadWeather(){
  var W=WEATHER||{name:"서울 광진구",lat:37.5385,lon:127.0823};
  var base="latitude="+W.lat+"&longitude="+W.lon+"&timezone=Asia%2FSeoul&forecast_days=2";
  var f1=fetch("https://api.open-meteo.com/v1/forecast?"+base+"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max").then(function(r){if(!r.ok)throw 0;return r.json()});
  var f2=fetch("https://air-quality-api.open-meteo.com/v1/air-quality?"+base+"&hourly=pm10,pm2_5").then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null});
  Promise.all([f1,f2]).then(function(res){
    var f=res[0].daily,aq=res[1]&&res[1].hourly,days=[];
    for(var i=0;i<f.time.length;i++){
      var k=f.time[i],code=f.weather_code[i],w=wmo(code),dust="";
      if(aq){var a10=[],a25=[];aq.time.forEach(function(t,j){if(t.slice(0,10)===k){if(aq.pm10[j]!=null)a10.push(aq.pm10[j]);if(aq.pm2_5[j]!=null)a25.push(aq.pm2_5[j])}});
        var avg=function(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null};dust=grade(avg(a10),avg(a25))}
      var d={d:k,icon:w[1],sky:w[2]+((f.wind_speed_10m_max[i]||0)>=30?" · 바람 강함":""),hi:Math.round(f.temperature_2m_max[i]),lo:Math.round(f.temperature_2m_min[i]),pop:f.precipitation_probability_max[i]==null?"":f.precipitation_probability_max[i]};
      if(dust)d.dust=dust;
      days.push(d);
    }
    weather={loc:W.name,updatedAt:new Date().toISOString(),days:days};render();
  }).catch(function(){if(!weather)weather={loc:W.name,days:[]};render()});
}

/* ---------- clock & rollover ---------- */
function handDeg(now){var m=now.getMinutes();return {h:(now.getHours()%12)*30+m/2,m:m*6}}
function clockSvg(now){
  var d=handDeg(now),n="";
  for(var i=1;i<=12;i++){var a=i*Math.PI/6;n+='<text x="'+(37*Math.sin(a)).toFixed(1)+'" y="'+(-37*Math.cos(a)).toFixed(1)+'">'+i+'</text>'}
  return '<svg class="clock" id="clock" viewBox="-50 -50 100 100" role="img" aria-label="'+now.getHours()+'시 '+now.getMinutes()+'분"><circle class="face" r="46"/>'+n+
    '<line class="hh" y2="-20" transform="rotate('+d.h+')"/><line class="mh" y2="-30" transform="rotate('+d.m+')"/><circle class="dot" r="4"/></svg>';
}
var lastSlot=autoSlot();
setInterval(function(){
  var now=new Date(),c=document.getElementById("clock");
  if(c)c.outerHTML=clockSvg(now);
  var s=autoSlot();
  if(db&&subKey&&subKey!==todayKey()){subscribeDaily();ui.slot=null;render()}
  else if(s!==lastSlot&&!ui.edit){lastSlot=s;ui.slot=null;render()}
  lastSlot=s;
},15000);
